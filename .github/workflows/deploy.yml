name: deploy

# 推到 main 或手动触发。本仓库先跑检查，再调用 rende-deploy。
# 共享工作流只发送 deploy recipes <40位 sha>。不要 rsync，也不要在远程跑任意 shell。
# 调用方的并发组不用 rende-deploy-recipes：被调用的工作流已经占用这个名字，同名会互相等待。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: enamel-recipes-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: test
    uses: rendeyuwei/rende-deploy/.github/workflows/deploy-project.yml@main
    with:
      project: recipes
      node_version: "22"
      health_url: https://rende.fun/recipes/api/health
      health_body: '{"ok":true}'
    secrets:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
